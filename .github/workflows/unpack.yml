name: unpack

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unpack ps4-builder-repo.zip
        run: |
          test -f ps4-builder-repo.zip || { echo "ERROR: ps4-builder-repo.zip not found in the repo root"; exit 1; }
          unzip -o ps4-builder-repo.zip -x '.github/*'
          rm ps4-builder-repo.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "unpack repo files"
          git push
